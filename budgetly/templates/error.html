<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — Budgetly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="error-page">
    <main class="error-card">
        <div class="error-code">{{ code }}</div>
        <p class="eyebrow">Budgetly</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="button-link" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}">Go back</a>
    </main>
</body>
</html>
