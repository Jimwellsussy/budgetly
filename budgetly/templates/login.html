{% extends "base.html" %}
{% block title %}Log In — Budgetly{% endblock %}

{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>💰 Budgetly</h1>
        <p class="subtitle">Log in to your budget</p>
        <form method="POST" class="auth-form" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>
                Username
                <input type="text" name="username" autocomplete="off" spellcheck="false" required autofocus>
            </label>
            <label>
                Password
                <div class="password-wrap">
                    <input type="password" name="password" id="password" autocomplete="off" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="eyeClosed" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 4.22-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </label>
            <button type="submit">Log In</button>
        </form>
        <p class="auth-switch">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
    </div>
</div>

<script>
document.getElementById('togglePassword').addEventListener('click', function () {
    const passwordInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    eyeOpen.classList.toggle('hidden', isHidden);
    eyeClosed.classList.toggle('hidden', !isHidden);
    this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
});
</script>
{% endblock %}
